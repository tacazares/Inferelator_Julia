<svg width="560" height="598" viewBox="0 0 560 598" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

  <!-- Background -->
  <rect width="560" height="598" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">InferelatorJL · mLASSO-StARS Pipeline</text>

  <!-- ── Step 1 ── -->
  <rect x="20" y="42" width="520" height="64" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <circle cx="50" cy="74" r="13" fill="#4F46E5"/>
  <text x="50" y="79" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
  <text x="74" y="68" font-size="13" font-weight="600" fill="#1E1B4B">Load &amp; Filter Data</text>
  <text x="74" y="86" font-size="11" fill="#6366F1" font-family="'Courier New', Courier, monospace">loadData()</text>

  <!-- Arrow -->
  <line x1="280" y1="106" x2="280" y2="124" stroke="#9CA3AF" stroke-width="1.5"/>
  <polygon points="280,130 274,120 286,120" fill="#9CA3AF"/>

  <!-- ── Steps 2 + 3 ── -->
  <rect x="20" y="132" width="520" height="74" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <circle cx="50" cy="169" r="13" fill="#4F46E5"/>
  <text x="50" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
  <text x="74" y="160" font-size="13" font-weight="600" fill="#1E1B4B">Process Prior + Estimate TFA</text>
  <text x="74" y="178" font-size="11" fill="#6366F1" font-family="'Courier New', Courier, monospace">loadPrior()  ·  estimateTFA()</text>
  <text x="74" y="196" font-size="10" fill="#9CA3AF" font-style="italic">merge degenerate TFs · least-squares TFA estimation</text>

  <!-- Arrow -->
  <line x1="280" y1="206" x2="280" y2="224" stroke="#9CA3AF" stroke-width="1.5"/>
  <polygon points="280,230 274,220 286,220" fill="#9CA3AF"/>

  <!-- ── Step 3b (optional) ── -->
  <rect x="20" y="232" width="520" height="52" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="50" cy="258" r="13" fill="#9CA3AF"/>
  <text x="50" y="263" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">3b</text>
  <text x="74" y="253" font-size="13" font-weight="600" fill="#6B7280">Time-lag Correction</text>
  <text x="74" y="271" font-size="11" fill="#9CA3AF" font-family="'Courier New', Courier, monospace">applyTimeLag()  <tspan font-family="sans-serif" font-style="italic" font-size="10">— optional, time-series data only</tspan></text>

  <!-- Arrow -->
  <line x1="280" y1="284" x2="280" y2="302" stroke="#9CA3AF" stroke-width="1.5"/>
  <polygon points="280,308 274,298 286,298" fill="#9CA3AF"/>

  <!-- ── Step 4 ── -->
  <rect x="20" y="310" width="520" height="86" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <circle cx="50" cy="353" r="13" fill="#4F46E5"/>
  <text x="50" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>
  <text x="74" y="335" font-size="13" font-weight="600" fill="#1E1B4B">Build GRN</text>
  <text x="74" y="353" font-size="11" fill="#6366F1" font-family="'Courier New', Courier, monospace">buildNetwork()</text>
  <!-- Two mode sub-boxes -->
  <rect x="74" y="360" width="196" height="26" rx="5" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="172" y="377" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="500">TFA mode</text>
  <rect x="278" y="360" width="242" height="26" rx="5" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="399" y="377" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="500">TF mRNA mode</text>

  <!-- Arrow -->
  <line x1="280" y1="396" x2="280" y2="414" stroke="#9CA3AF" stroke-width="1.5"/>
  <polygon points="280,420 274,410 286,410" fill="#9CA3AF"/>

  <!-- ── Step 5 ── -->
  <rect x="20" y="422" width="520" height="64" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <circle cx="50" cy="454" r="13" fill="#4F46E5"/>
  <text x="50" y="459" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">5</text>
  <text x="74" y="448" font-size="13" font-weight="600" fill="#1E1B4B">Aggregate Networks</text>
  <text x="74" y="466" font-size="11" fill="#6366F1" font-family="'Courier New', Courier, monospace">aggregateNetworks()  <tspan font-family="sans-serif" font-size="10" fill="#9CA3AF">— consensus TFA + mRNA network</tspan></text>

  <!-- Arrow -->
  <line x1="280" y1="486" x2="280" y2="504" stroke="#9CA3AF" stroke-width="1.5"/>
  <polygon points="280,510 274,500 286,500" fill="#9CA3AF"/>

  <!-- ── Step 6 ── -->
  <rect x="20" y="512" width="520" height="64" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <circle cx="50" cy="544" r="13" fill="#4F46E5"/>
  <text x="50" y="549" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">6</text>
  <text x="74" y="538" font-size="13" font-weight="600" fill="#1E1B4B">Refine TFA on Consensus Network</text>
  <text x="74" y="556" font-size="11" fill="#6366F1" font-family="'Courier New', Courier, monospace">refineTFA()  <tspan font-family="sans-serif" font-size="10" fill="#9CA3AF">— data-driven TFA from final GRN prior</tspan></text>

</svg>
